services:
  engine:
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    container_name: go-coach-engine
    restart: unless-stopped
    user: "1000:1001"
    working_dir: /app
    # Loopback binding inside the container is reachable by the dedicated host tunnel.
    network_mode: host
    command: ["python3", "engine_bridge.py", "--port", "8874", "--token-file", "/app/.local/engine-fnos-token"]
    environment:
      GO_COACH_KATAGO: /app/squashfs-root/AppRun
      GO_COACH_MODEL: /app/model-b18.bin.gz
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /vol2/1000/go-coach-engine:/app:ro
      - /vol2/1000/go-coach-engine/.local:/app/.local:rw
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 4
    mem_limit: 1536m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
  tunnel:
    image: python:3.12-slim-bookworm@sha256:782412e85d0f0984994c290652577d4018aff08145c85b262bb63dc0c7522254
    container_name: go-coach-tunnel-primary
    restart: unless-stopped
    user: "1000:1001"
    working_dir: /app
    network_mode: host
    command: ["/app/cloudflared-linux-amd64", "tunnel", "--no-autoupdate", "--protocol", "http2", "run", "--token-file", "/app/.local/tunnel-fnos-token"]
    volumes:
      - /vol2/1000/go-coach-engine:/app:ro
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    depends_on: [engine]
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
